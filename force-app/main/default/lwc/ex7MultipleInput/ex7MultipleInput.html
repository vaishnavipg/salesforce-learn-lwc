<template>
    <lightning-card   title="Example 7 - Handle Multiple User Input">
        <lightning-input
            label="Enter your first name"
            value={firstName}
            onchange={handleChange}>
        </lightning-input>
        
        <lightning-input
            label="Enter your last name"
            value={lastName}
            onchange={handleChange}>
        </lightning-input>
        <br/>
        <p><b>Hello, {firstName} {lastName} </b></p>
    </lightning-card>
</template>
