<template>
    <lightning-card title="Calculator">

        <div class="slds-p-around_medium">

            <lightning-input
                type="number"
                label="First Number"
                onchange={handleFirst}>
            </lightning-input>

            <lightning-input
                type="number"
                label="Second Number"
                onchange={handleSecond}>
            </lightning-input>

            <div class="slds-m-top_medium">

                <lightning-button label="Add" onclick={handleAdd}></lightning-button>

                <lightning-button label="Subtract" onclick={handleSubtract}></lightning-button>

                <lightning-button label="Multiply" onclick={handleMultiply}></lightning-button>

                <lightning-button label="Divide" onclick={handleDivide}></lightning-button>

            </div>

            <p class="slds-m-top_medium">
                Result: {result}
            </p>

        </div>

    </lightning-card>
</template>
